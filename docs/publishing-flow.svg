<svg xmlns="http://www.w3.org/2000/svg" width="680" height="570" viewBox="0 0 680 570" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>vakarsh.in publishing flow</title>
<desc>Write on an article branch in private Owl, PR into publish, a GitHub Action opens a PR on the public site, merging it deploys vakarsh.in.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>.h{font-size:14px;font-weight:500}.s{font-size:12px}.l{stroke:#73726c;stroke-width:1.5;fill:none}</style>
<rect width="680" height="570" fill="#ffffff"/>
<rect x="40" y="20" width="600" height="230" rx="16" fill="none" stroke="#b4b2a9" stroke-dasharray="4 4"/>
<text class="h" x="60" y="46" fill="#2c2c2a">Owl, private: where you write</text>
<rect x="60" y="70" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="h" x="140" y="93" text-anchor="middle" fill="#3C3489">main</text>
<text class="s" x="140" y="112" text-anchor="middle" fill="#534AB7">Tooling, never publishes</text>
<rect x="260" y="70" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
<text class="h" x="340" y="93" text-anchor="middle" fill="#3C3489">publish</text>
<text class="s" x="340" y="112" text-anchor="middle" fill="#534AB7">Reviewed line</text>
<rect x="460" y="70" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="h" x="540" y="93" text-anchor="middle" fill="#3C3489">Article branch</text>
<text class="s" x="540" y="112" text-anchor="middle" fill="#534AB7">pieces/slug.md</text>
<line class="l" x1="222" y1="98" x2="256" y2="98" stroke-dasharray="3 3" marker-end="url(#a)"/>
<line class="l" x1="422" y1="88" x2="456" y2="88" marker-end="url(#a)"/>
<line class="l" x1="458" y1="110" x2="424" y2="110" marker-end="url(#a)"/>
<text class="s" x="140" y="150" text-anchor="middle" fill="#5f5e5a">Sync when tooling changes</text>
<text class="s" x="540" y="150" text-anchor="middle" fill="#5f5e5a">1. Branch off publish</text>
<text class="s" x="540" y="168" text-anchor="middle" fill="#5f5e5a">2. PR back, you merge</text>
<line class="l" x1="340" y1="128" x2="340" y2="176" marker-end="url(#a)"/>
<rect x="260" y="180" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="h" x="340" y="203" text-anchor="middle" fill="#2c2c2a">GitHub Action</text>
<text class="s" x="340" y="222" text-anchor="middle" fill="#5F5E5A">Exports opted-in posts</text>
<rect x="40" y="280" width="600" height="190" rx="16" fill="none" stroke="#b4b2a9" stroke-dasharray="4 4"/>
<text class="h" x="60" y="306" fill="#2c2c2a">vakarsh.in, public: the website</text>
<line class="l" x1="340" y1="238" x2="340" y2="316" marker-end="url(#a)"/>
<text class="s" x="352" y="270" fill="#5f5e5a">3. Opens site PR</text>
<rect x="260" y="320" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="h" x="340" y="343" text-anchor="middle" fill="#085041">Auto PR</text>
<text class="s" x="340" y="362" text-anchor="middle" fill="#0F6E56">Public before merge</text>
<line class="l" x1="340" y1="378" x2="340" y2="394" marker-end="url(#a)"/>
<text class="s" x="352" y="390" fill="#5f5e5a">4. You merge</text>
<rect x="260" y="396" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<text class="h" x="340" y="419" text-anchor="middle" fill="#085041">main</text>
<text class="s" x="340" y="438" text-anchor="middle" fill="#0F6E56">Auto-deploys</text>
<rect x="60" y="396" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="h" x="140" y="419" text-anchor="middle" fill="#2c2c2a">Manual edits</text>
<text class="s" x="140" y="438" text-anchor="middle" fill="#5F5E5A">Talks, about, config</text>
<line class="l" x1="222" y1="424" x2="256" y2="424" marker-end="url(#a)"/>
<line class="l" x1="340" y1="454" x2="340" y2="500" marker-end="url(#a)"/>
<text class="s" x="352" y="482" fill="#5f5e5a">5. GitHub Pages</text>
<rect x="250" y="504" width="180" height="44" rx="22" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="h" x="340" y="531" text-anchor="middle" fill="#085041">vakarsh.in live</text>
</svg>
