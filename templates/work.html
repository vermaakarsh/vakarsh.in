{% extends "base.html" %}
{% block main_content %}
<main class="work-page">
  <h1>{{ page.title }}</h1>
  {{ page.content | safe }}
  <ul class="work-list">
    {% for project in page.extra.projects %}
    <li class="work-item">
      <span class="work-kind">{{ project.kind }}</span>
      <div><h3><a href="{{ project.url | safe }}">{{ project.name }}</a></h3><p>{{ project.description }}</p></div>
    </li>
    {% endfor %}
  </ul>
</main>
{% endblock main_content %}
