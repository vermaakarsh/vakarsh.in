{% component journey(page: map) %}
<ol class="life-timeline" aria-label="Akarsh's life so far">
{% for step in page.extra.journey | reverse %}
<li class="journey-entry{% if step.highlight is defined and step.highlight %} journey-highlight{% endif %}"><div class="journey-date"><span class="journey-year">{{ step.year }}</span>{% if step.duration is defined %}<small class="journey-duration">{{ step.duration }}</small>{% endif %}</div><div><h3>{{ step.title }}</h3>{{ step.text | markdown | trim | safe }}</div></li>
{% endfor %}
</ol>
{% endcomponent journey %}
