<script>
  (() => {
    const toc = document.querySelector(".right-content .toc");
    const article = document.querySelector("main article");
    if (!toc || !article) return;

    // Narrow screens: collapsible "On this page" above the article.
    const details = document.createElement("details");
    details.className = "mobile-toc";
    const summary = document.createElement("summary");
    summary.textContent = "On this page";
    details.append(summary, toc);
    article.insertBefore(details, article.querySelector(".body"));

    // Wide screens: a scan rail on the left; hover or focus to read it.
    const links = [...toc.querySelectorAll("a")];
    const rail = document.createElement("nav");
    rail.className = "toc-rail";
    rail.setAttribute("aria-label", "On this page");
    const list = document.createElement("ol");
    const items = links.map((a) => {
      const li = document.createElement("li");
      if (a.closest("ul ul")) li.className = "sub";
      const link = document.createElement("a");
      link.href = a.getAttribute("href");
      link.innerHTML = '<span class="tick" aria-hidden="true"></span><span class="label"></span>';
      link.querySelector(".label").textContent = a.textContent;
      li.append(link);
      list.append(li);
      return { li, id: decodeURIComponent(link.hash.slice(1)) };
    });
    rail.append(list);
    document.body.append(rail);

    const wide = window.matchMedia("(min-width: 1100px)");
    const place = () => { details.hidden = wide.matches; rail.hidden = !wide.matches; };
    place();
    wide.addEventListener("change", place);

    const targets = items.map((i) => document.getElementById(i.id)).filter(Boolean);
    const mark = () => {
      let current = items[0];
      for (const i of items) {
        const el = document.getElementById(i.id);
        if (el && el.getBoundingClientRect().top < window.innerHeight * 0.3) current = i;
      }
      items.forEach((i) => i.li.classList.toggle("active", i === current));
    };
    if (targets.length) { mark(); window.addEventListener("scroll", mark, { passive: true }); }
  })();
</script>
